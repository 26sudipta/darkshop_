<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-neutral-900 font-mono">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="w-full max-w-md">
        <h1 class="text-4xl font-bold text-green-400 text-center mb-8">DarkShop_</h1>
        <div class="bg-neutral-950 border border-green-500/30 rounded-lg p-6">
          <h2 class="text-2xl text-green-400 mb-4">Create Account</h2>
          <div class="space-y-4">
            <div>
              <label class="text-green-300 text-sm">Username</label>
              <input type="text" id="signupUsername" class="w-full bg-neutral-900 border border-green-500/30 rounded px-3 py-2 text-green-300 focus:outline-none focus:border-green-500" placeholder="Choose username">
            </div>
            <div>
              <label class="text-green-300 text-sm">Email</label>
              <input type="email" id="signupEmail" class="w-full bg-neutral-900 border border-green-500/30 rounded px-3 py-2 text-green-300 focus:outline-none focus:border-green-500" placeholder="Enter email">
            </div>
            <div>
              <label class="text-green-300 text-sm">Password</label>
              <input type="password" id="signupPassword" class="w-full bg-neutral-900 border border-green-500/30 rounded px-3 py-2 text-green-300 focus:outline-none focus:border-green-500" placeholder="Create password">
            </div>
            <button onclick="handleSignup()" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Sign Up</button>
          </div>
          <div class="text-center mt-4 space-x-4">
            <a href="login.html" class="text-green-400 hover:text-green-300">Already have an account? Login</a>
            <a href="index.html" class="text-green-400 hover:text-green-300">← Back to Shop</a>
          </div>
        </div>
      </div>
    </div>
    <script src="signup.js"></script>
  </body>
</html>
