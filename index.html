<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-neutral-900 font-mono">
  <nav class="sticky top-0 z-50 bg-neutral-950 text-green-400 border-b border-green-500/30">
    <div class="max-w-7xl mx-auto px-4 md:px-6 py-3">
      <div class="flex flex-wrap items-center justify-between gap-4">

        <div class="text-2xl font-semibold tracking-wide text-green-400">DarkShop_</div>


        <ul class="order-3 w-full sm:order-none sm:w-auto flex justify-center gap-6  text-sm">
          <li><a href="#" class="hover:text-green-300">Home</a></li>
          <li><a href="#" class="hover:text-green-300">Products</a></li>
          <li><a href="#" class="hover:text-green-300">About</a></li>
          <li><a href="#" class="hover:text-green-300">Contact</a></li>
        </ul>


        <div class="flex items-center gap-4">
          <h1 class="font-mono text-lg">
            <span class="text-green-300 font-semibold" id="navTotal">$1000</span>
          </h1>
          <button onclick="addMoney()" class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700">
            Add Money
          </button>
          <div id="authButtons">
            <a href="login.html" class="font-mono text-xs uppercase tracking-wider border border-green-500/50 text-green-300 px-4 py-2 rounded-md hover:bg-green-500/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-500/60 inline-block">
              Login
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Sliding Banner -->
  <section class="bg-neutral-900">
    <div class="relative w-full">
      <div id="bannerViewport" class="overflow-hidden">
        <div id="bannerSlider" class="flex transition-transform duration-500"></div>
      </div>
      <!-- Controls -->
      <button onclick="bannerPrev()" class="absolute left-6 top-1/2 -translate-y-1/2 bg-neutral-900/70 hover:bg-neutral-900 text-green-300 border border-green-500/40 rounded px-3 py-2">‹</button>
      <button onclick="bannerNext()" class="absolute right-6 top-1/2 -translate-y-1/2 bg-neutral-900/70 hover:bg-neutral-900 text-green-300 border border-green-500/40 rounded px-3 py-2">›</button>
    </div>
  </section>

  <!-- Products  and cart -->
  <div class="flex gap-4 p-4">
    <!-- Products -->
    <div id="Products" class="grid grid-cols-3 gap-4 flex-1">
      
    </div>
    <!-- cart section -->
    <div id="cart" class="p-4 border border-green-500/30 rounded w-80">
      <h2 class="text-green-400 text-xl mb-4">Cart</h2>
      <div id="cartItems"></div>
      
      <div class="mt-4 text-green-300">
        <p>Total Products: <span id="totalProducts">0</span></p>
        <p>Subtotal: $<span id="cartTotal">0</span></p>
        <p>Delivery Charge: $<span id="deliveryCharge">5</span></p>
        <p>Discount: $<span id="discount">0</span></p>
        <p class="text-green-400 font-bold text-xl">Final Total: $<span id="finalTotal">0</span></p>
      </div>
      
      <div class="mt-4">
        <input type="text" id="couponInput" placeholder="Enter SMART10" class="bg-neutral-800 text-green-300 px-3 py-2 rounded">
        <button onclick="applyCoupon()" class="bg-green-600 text-white px-4 py-2 rounded ml-2">Apply Coupon</button>
      </div>
      
      <button onclick="buyNow()" class="bg-green-600 text-white px-4 py-2 rounded mt-4 w-full">Buy Now</button>
    </div>
  </div>

  <!-- Reviews Section -->
  <div class="p-4 mt-8">
    <h2 class="text-green-400 text-2xl font-bold mb-4">Customer Reviews</h2>
    <div class="relative">
      <div id="reviewsContainer" class="overflow-hidden">
        <div id="reviewsSlider" class="flex transition-transform duration-500 gap-4"></div>
      </div>
      <button onclick="prevReview()" class="absolute left-0 top-1/2 -translate-y-1/2 bg-green-600 text-white px-3 py-2 rounded">‹</button>
      <button onclick="nextReview()" class="absolute right-0 top-1/2 -translate-y-1/2 bg-green-600 text-white px-3 py-2 rounded">›</button>
    </div>
  </div>
  
  <script src="main.js"></script>
  </body>
</html>
